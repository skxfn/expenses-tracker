name: Expenses
options:
  bundleIdPrefix: com.skxfn
  deploymentTarget:
    iOS: "17.0"
  projectFormat: xcode16_0
  developmentLanguage: ru
packages:
  ExpenseCore:
    path: Packages/ExpenseCore
targets:
  Expenses:
    type: application
    platform: iOS
    sources:
      - path: App
        type: syncedFolder
    configFiles:
      Debug: Config/Version.xcconfig
      Release: Config/Version.xcconfig
    dependencies:
      - package: ExpenseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skxfn.expenses
        PRODUCT_NAME: Expenses
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Траты
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  Expenses:
    build:
      targets:
        Expenses: all
    archive:
      config: Release
